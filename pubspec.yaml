name: jazz_piano_tools
description: A Flutter app for learning jazz piano.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  drift: ^2.25.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  fsrs: ^2.0.1
  flutter_piano_pro: ^0.6.0
  simple_sheet_music: ^1.0.1
  flutter_midi_pro: ^2.0.0
  uuid: ^4.5.1
  json_annotation: ^4.9.0
  collection: ^1.19.1
  equatable: ^2.0.7
  freezed_annotation: ^3.0.0
  flutter_markdown: ^0.7.6+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  drift_dev: ^2.25.0
  json_serializable: ^6.9.5
  freezed: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/concepts/
    - assets/content/exercises/
    - assets/content/decks/
    - assets/soundfonts/
